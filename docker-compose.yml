version: "3.9"

services:
  api:
    build: .
    container_name: summarizer_api
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - ollama
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app

  worker:
    build: .
    container_name: summarizer_worker
    command: celery -A worker.app worker --loglevel=info
    depends_on:
      - redis
      - ollama
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app

  redis:
    image: redis:7
    container_name: summarizer_redis
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    container_name: summarizer_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
